*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0002}
body{user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#mid{z-index:1}
#front{z-index:3;pointer-events:none}

.stage{position:fixed;left:0;right:0;top:15vh;bottom:22vh;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.stage::before{content:"";position:absolute;inset:-4% 14%;z-index:-1;background:radial-gradient(ellipse at center,rgba(14,0,4,.66) 0%,rgba(14,0,4,.34) 42%,transparent 70%)}
.fx{opacity:0}
.go .fx{animation:fadeUp 1.5s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.hi{font-family:'YT',serif;font-size:clamp(22px,min(4vw,5.8vh),66px);line-height:1.25;color:#f6c453;letter-spacing:.03em;text-shadow:0 2px 0 #4a0d00,0 0 24px rgba(255,140,30,.6)}
.gold{background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,240,.95) 50%,transparent 58%),linear-gradient(180deg,#fff4bf 0%,#f9d977 22%,#e0a93a 45%,#a8690f 58%,#e8b84a 75%,#fff0a8 92%,#c98d22 100%);background-size:300% 100%,100% 100%;background-position:150% 0,0 0;background-repeat:no-repeat}
@keyframes gshine{0%{background-position:150% 0,0 0}45%,100%{background-position:-50% 0,0 0}}
.title{font-family:'GV',cursive;font-weight:400;font-size:clamp(64px,min(12vw,19vh),240px);line-height:1.12;white-space:nowrap;filter:drop-shadow(0 4px 0 #3d0a00) drop-shadow(0 0 28px rgba(255,150,40,.5));transition:filter 1.2s ease}
.finale .title{filter:drop-shadow(0 4px 0 #3d0a00) drop-shadow(0 0 42px rgba(255,190,80,.95))}
.title .t{display:inline-block;padding:0 .3em .06em;-webkit-background-clip:text;background-clip:text;color:transparent;clip-path:inset(-30% 100% -30% -5%)}
.go .title .t{animation:write 2.6s cubic-bezier(.45,0,.55,1) 3.6s forwards,gshine 7s ease-in-out 6.8s infinite}
@keyframes write{to{clip-path:inset(-30% -5% -30% -5%)}}
.orn{width:min(420px,56vw);height:auto;margin:.4vh 0 1.4vh;overflow:visible}
.msg{font-family:'CG',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(16px,min(2vw,2.9vh),31px);line-height:1.35;color:#f3dcc0;max-width:min(860px,72vw);text-shadow:0 2px 10px rgba(0,0,0,.85)}
.from{font-family:'CZ',Georgia,serif;font-weight:600;font-size:clamp(10px,min(1.1vw,1.6vh),15px);letter-spacing:.38em;text-transform:uppercase;color:#d9a95a;margin-top:2.4vh;padding-left:.38em}
.logo-wrap{margin-top:1.2vh;filter:drop-shadow(0 2px 0 rgba(50,8,0,.95)) drop-shadow(0 0 18px rgba(255,160,50,.4))}
.logo{height:clamp(36px,7.6vh,90px);aspect-ratio:884/118;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:gshine 7s ease-in-out 9.5s infinite}

/* ---------- palace doors intro ---------- */
.doors{position:fixed;inset:0;z-index:9;perspective:2200px;pointer-events:none;animation:dIn .9s ease both}
@keyframes dIn{from{opacity:0}}
.door{position:absolute;top:0;bottom:0;width:50.3%;overflow:hidden;backface-visibility:hidden;transition:transform 3s cubic-bezier(.55,0,.25,1),filter 3s ease;
  background:radial-gradient(circle,#ffe7a0 0 1.6px,#c08a2a 2.2px,#5a3206 3.2px,transparent 3.8px) 0 0/34px 34px,linear-gradient(90deg,#3a040b,#6e0c18 50%,#3a040b);
  box-shadow:inset 0 0 0 10px #240206,inset 0 0 0 14px #c99a3a,inset 0 0 0 18px #240206,inset 0 0 160px rgba(0,0,0,.75)}
.door.l{left:0;transform-origin:0 50%}
.door.r{right:0;transform-origin:100% 50%}
.open .door.l{transform:rotateY(-104deg);filter:brightness(.4)}
.open .door.r{transform:rotateY(104deg);filter:brightness(.4)}
.pn{position:absolute;left:14%;right:14%;border:3px solid #d9a63a;background:linear-gradient(180deg,rgba(255,200,120,.06),rgba(0,0,0,.35));box-shadow:0 0 0 5px #240206,0 0 0 7px #8a5a14,inset 0 0 50px rgba(0,0,0,.65)}
.pn.a{top:7%;height:47%;border-radius:50% 50% 8px 8px/24% 24% 8px 8px}
.pn.b{top:61%;bottom:7%;border-radius:8px}
.ring{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border:6px solid #e0b04a;border-radius:50%;box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 0 5px #7a4e10}
.door.l .ring{right:6%}.door.r .ring{left:6%}
.med{position:absolute;top:50%;width:min(44vh,360px);height:min(44vh,360px);transform:translateY(-50%)}
.door.l .med{right:calc(min(44vh,360px) / -2)}.door.r .med{left:calc(min(44vh,360px) / -2)}
.leak{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff3c4;box-shadow:0 0 30px 10px rgba(255,190,90,.85),0 0 140px 50px rgba(255,120,40,.55);opacity:0;animation:leak 1.1s ease .5s forwards}
@keyframes leak{to{opacity:1}}
.open .leak{animation:leakOut 1.2s ease forwards}
@keyframes leakOut{from{opacity:1}to{opacity:0;transform:scaleX(40)}}

.ctrl{position:fixed;right:18px;bottom:16px;z-index:10;display:flex;gap:8px;transition:opacity .6s}
.ctrl button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,200,120,.35);background:rgba(30,4,8,.6);color:#ffd88a;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s}
.ctrl button:hover{background:rgba(90,15,25,.8)}
.ctrl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#snd .on{display:none}#snd.active .on{display:inline}#snd.active .off{display:none}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;font:600 11px/1 'CZ',Georgia,serif;letter-spacing:.16em;color:rgba(255,215,160,.8);white-space:nowrap;opacity:0;pointer-events:none;animation:hint 10s ease 9s forwards;text-shadow:0 1px 6px #000}
@keyframes hint{10%,85%{opacity:1}100%{opacity:0}}
body.idle{cursor:none}body.idle .ctrl{opacity:0}
@media (max-width:700px){.hint{display:none}}
</style>
</head>

  <div class="hi fx" style="--d:3.1s">शुभ दीपावली</div>
  <h1 class="title"><span class="t gold">Happy Diwali</span></h1>
  <svg class="orn fx" style="--d:6.2s" viewBox="0 0 420 24" aria-hidden="true">

/* ======== ARCH GEOMETRY ======== */
function archPts(xl, spring, a, h, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n, f = Math.sqrt(1 - (1 - t) ** 2) * .82 + .18 * t ** 6; pts.push([xl + a * t, spring - h * f]); }
  return pts;
}
function archYAt(x) {
  const a = (XR - XL) / 2, h = SPRING - APEX; let t = x < W / 2 ? (x - XL) / a : (XR - x) / a;
  if (t <= 0) return SPRING; t = Math.min(1, t);
  return SPRING - h * (Math.sqrt(1 - (1 - t) ** 2) * .82 + .18 * t ** 6);
}
function openingPath() {
  const a = (XR - XL) / 2, h = SPRING - APEX, N = 7;
  const left = archPts(XL, SPRING, a, h, N), right = left.map(([x, y]) => [W - x, y]).reverse();
  const all = left.concat(right.slice(1));
  const p = new Path2D(); p.moveTo(XL, SILL); p.lineTo(XL, SPRING);
  for (let i = 1; i < all.length; i++) {
    const [x0, y0] = all[i - 1], [x1, y1] = all[i], dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    const bulge = L * .34, mxp = (x0 + x1) / 2 - dy / L * bulge, myp = (y0 + y1) / 2 + dx / L * bulge;
    p.quadraticCurveTo(mxp, myp, x1, y1);
  }
  p.lineTo(XR, SILL); p.closePath();
  return { p, pts: all };
}

  for (const [x, y] of left.concat(right.slice(1))) p.lineTo(x, y);
  p.lineTo(XR + d, SILL);

}

  ring(20, .56, .76, .045, ['#ffb000'], 9, false);
  disk(.4, .46, '#ffcc1a');
  ring(10, .16, .4, .1, ['#ff5a1f', '#ff8f00'], 0, true);

  for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; x.fillStyle = '#fff7e0'; x.beginPath(); x.arc(Math.cos(a) * .44 * R, Math.sin(a) * .44 * R, R * .012, 0, TAU); x.fill(); }

  for (let i = 0; i < n; i++) { const a = i / n * TAU; x.drawImage(i % 3 ? pick(mg.o) : pick(mg.y), Math.cos(a) * .95 * R - fs / 2, Math.sin(a) * .95 * R - fs / 2, fs, fs); }
  for (let i = 0; i < 60; i++) { const a = rand(0, TAU), rr = rand(.98, 1.08) * R; x.save(); x.translate(Math.cos(a) * rr, Math.sin(a) * rr); x.rotate(rand(0, TAU)); x.fillStyle = pick(['#a3101e', '#c4161f', '#ff8a00', '#ffc400']); x.beginPath(); x.ellipse(0, 0, R * .025, R * .015, 0, 0, TAU); x.fill(); x.restore(); }

function medallion(x, cx, cy, r) {

  x.fillStyle = '#2a0307'; x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill();

  x.strokeStyle = g; x.lineWidth = r * .04; x.stroke();
  x.restore();
}

function pillar(x, x0, w) {
  const g = x.createLinearGradient(x0, 0, x0 + w, 0);
  g.addColorStop(0, '#2a0307'); g.addColorStop(.5, '#5a0a14'); g.addColorStop(1, '#2a0307');
  x.fillStyle = g; x.fillRect(x0, SPRING, w, SILL - SPRING);
  const gg = goldGrad(x, 0, SPRING, 0, SILL);
  x.strokeStyle = gg; x.lineWidth = 1.4;
  for (let i = 1; i < 4; i++) { const px = x0 + w * i / 4; x.beginPath(); x.moveTo(px, SPRING + 30 * S); x.lineTo(px, SILL - 30 * S); x.stroke(); }
  const cap = (y0, y1) => {
    x.fillStyle = goldGrad(x, x0 - 8 * S, 0, x0 + w + 8 * S, 0);
    x.fillRect(x0 - 8 * S, y0, w + 16 * S, 7 * S);
    x.fillRect(x0 - 3 * S, y1, w + 6 * S, 7 * S);
    x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(x0 - 8 * S, y0 + 7 * S, w + 16 * S, 1.2);
  };
  cap(SPRING - 14 * S, SPRING - 7 * S); cap(SILL - 7 * S, SILL - 14 * S);
}

function buildMid() {
  const x = mx; x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, W, H);
  // wall
  let g = x.createLinearGradient(0, 0, 0, SILL);
  g.addColorStop(0, '#3a050b'); g.addColorStop(.5, '#520812'); g.addColorStop(1, '#3a050b');
  x.fillStyle = g; x.fillRect(0, 0, W, SILL);
  for (let i = 0; i < W * SILL / 30; i++) { x.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,170,150,.03)'; x.fillRect(rand(0, W), rand(0, SILL), rand(.5, 2), rand(.5, 2)); }
  const sp = 46 * S; x.strokeStyle = 'rgba(230,170,80,.12)'; x.lineWidth = 1;
  for (let row = 0, y = sp / 2; y < SILL; y += sp * .8, row++) for (let xx = (row % 2) * sp / 2; xx < W + sp; xx += sp) {
    for (let k = 0; k < 4; k++) { x.beginPath(); x.ellipse(xx + Math.cos(k * Math.PI / 2) * 5 * S, y + Math.sin(k * Math.PI / 2) * 5 * S, 5 * S, 2.4 * S, k * Math.PI / 2, 0, TAU); x.stroke(); }
  }
  // frame band around the arch
  const D = 30 * S, outer = outerPath(D);
  const band = new Path2D(outer); band.closePath();
  g = x.createLinearGradient(0, APEX, 0, SILL); g.addColorStop(0, '#2c0308'); g.addColorStop(1, '#3e050c');
  x.fillStyle = g; x.fill(band);
  const op = openingPath();
  // pillars
  pillar(x, XL - 34 * S, 34 * S); pillar(x, XR, 34 * S);
  // cut opening
  x.globalCompositeOperation = 'destination-out'; x.fill(op.p); x.globalCompositeOperation = 'source-over';
  // gold trims
  const gg = goldGrad(x, 0, 0, W, H);
  x.save(); x.lineJoin = 'round';
  x.strokeStyle = '#1a0104'; x.lineWidth = 12 * S; x.stroke(op.p);
  x.strokeStyle = gg; x.lineWidth = 4.5 * S; x.stroke(op.p);
  x.strokeStyle = 'rgba(255,240,190,.9)'; x.lineWidth = 3.2 * S; x.setLineDash([.1, 10 * S]); x.lineCap = 'round';
  x.lineDashOffset = 0; x.stroke(outerPath(D * .5)); x.setLineDash([]);
  x.strokeStyle = gg; x.lineWidth = 3 * S; x.stroke(outer);
  x.lineWidth = 1.2 * S; x.stroke(outerPath(D + 8 * S));
  x.restore();
  // cornice
  const ch = H * .035;
  g = x.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, '#1e0205'); g.addColorStop(1, '#3a050b');
  x.fillStyle = g; x.fillRect(0, 0, W, ch);
  x.fillStyle = gg; x.fillRect(0, ch, W, 3 * S);
  for (let xx = 0; xx < W; xx += 16 * S) x.fillRect(xx, ch + 3 * S, 8 * S, 6 * S);
  // spandrel medallions
  const mr = Math.min(H * .05, 60 * S), my = ch + (archYAt(W * .2) - D - ch) / 2 + 4 * S;
  if (archYAt(W * .2) - D - ch > mr * 2) { medallion(x, W * .2, my, mr); medallion(x, W * .8, my, mr); }
  // marigold garland following the arch edge
  const fs = GR * 2.7, pts = op.pts;
  const dense = [];
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(L / (GR * .62));
    for (let k = 0; k < n; k++) { const t = k / n; dense.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]); }
  }
  dense.forEach(([px, py], i) => x.drawImage(i % 6 < 2 ? pick(mg.y) : pick(mg.o), px - fs / 2, py - fs * .62, fs, fs));
  for (const [px, py] of [[XL, SPRING], [XR, SPRING], [W / 2, APEX]]) {
    for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; x.drawImage(pick(mg.o), px + Math.cos(a) * GR * .8 - fs / 2, py + Math.sin(a) * GR * .8 - fs / 2, fs, fs); }
    x.drawImage(mg.d[0], px - fs * .65, py - fs * .65, fs * 1.3, fs * 1.3);
  }
  // sill
  g = x.createLinearGradient(0, SILL, 0, SILL + SILLH); g.addColorStop(0, '#5a1a16'); g.addColorStop(1, '#2e0a09');
  x.fillStyle = g; x.fillRect(0, SILL, W, SILLH);
  x.fillStyle = gg; x.fillRect(0, SILL + SILLH, W, 2.5 * S);
  x.fillStyle = 'rgba(255,190,150,.25)'; x.fillRect(0, SILL, W, 1.2);
  // floor
  const F = FLOOR; g = x.createLinearGradient(0, F, 0, H); g.addColorStop(0, '#1e0307'); g.addColorStop(1, '#070102');
  x.fillStyle = g; x.fillRect(0, F, W, H - F);
  x.save(); x.beginPath(); x.rect(0, F, W, H - F); x.clip();
  const vpY = F - H * .5;
  x.strokeStyle = 'rgba(230,170,80,.1)'; x.lineWidth = 1;
  for (let i = -14; i <= 14; i++) { x.beginPath(); x.moveTo(W / 2 + i * W * .02, vpY + (F - vpY)); x.lineTo(W / 2 + i * W * .14, H + 40); x.stroke(); }
  for (let k = 1; k < 6; k++) { const y = F + (H - F) * (k / 6) ** 1.6; x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
  g = x.createLinearGradient(0, F, 0, H); g.addColorStop(0, 'rgba(255,100,60,.12)'); g.addColorStop(1, 'rgba(255,100,60,0)');
  x.fillStyle = g; x.fillRect(XL, F, XR - XL, H - F);
  x.restore();
  // rangoli on the floor (perspective)
  const rgc = buildRangoli(RC.R);
  x.save(); x.translate(RC.x, RC.y); x.scale(1, RC.k);
  x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 20;
  x.drawImage(rgc, -RC.R, -RC.R, RC.R * 2, RC.R * 2); x.restore();
  // petals scattered on floor
  for (let i = 0; i < W / 18; i++) {
    x.save(); x.translate(rand(0, W), rand(F + 6, H - 4)); x.rotate(rand(0, TAU)); x.scale(1, .45);
    x.fillStyle = pick(['#ff8a00', '#ffb000', '#9c0f1c', '#c4161f']); const r = rand(2, 4) * S;
    x.beginPath(); x.ellipse(0, 0, r, r * .7, 0, 0, TAU); x.fill(); x.restore();
  }
}

/* ======== DIYAS, LANTERNS, PETALS ======== */
function buildDiyas(lit) {
  diyas = [];
  const mk = (x, y, k, order) => ({ x, y, s: k * S, spr: diyaSprite(k * S, pick(CLAY), pick(PAINT)), ph: rand(0, TAU), ph2: rand(0, TAU), litAt: 0, order, sparked: lit, em: rand(0, 2), floor: y > FLOOR });
  diyas.push(mk(RC.x - 6 * S, RC.y + 6 * S, 1.15, 0));
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + Math.PI / 8;
    diyas.push(mk(RC.x + Math.cos(a) * RC.R * 1.12, RC.y + Math.sin(a) * RC.R * 1.12 * RC.k + 4 * S, .78, 1 + i * .12));
  }
  const ns = Math.max(6, Math.round((XR - XL) / (120 * S)));
  for (let i = 0; i < ns; i++) diyas.push(mk(XL + 50 * S + (XR - XL - 100 * S) * i / (ns - 1), SILL + SILLH * .72, .5, 2.2 + i * .08));
  for (const sx of [W * .05, W * .95]) diyas.push(mk(sx, H - (H - FLOOR) * .3, 1.05, 2.0));
  diyas.sort((a, b) => a.y - b.y);
  diyas.forEach(d => d.litAt = lit ? -10 : 1.8 + d.order);
}

function lanternSprite(h) {
  const w = h * .5, W2 = w * 1.3, H2 = h * 1.35, cx = W2 / 2, bt = h * .26, bb = h * .82, bw = w * .5, mid = (bt + bb) / 2;

  body.quadraticCurveTo(cx + bw * 1.1, mid, cx + bw * .86, bt); body.closePath();
  const [c, x] = mkCanvas(W2, H2), [gc, gx] = mkCanvas(W2, H2), [mc, m] = mkCanvas(W2, H2);
  let g = gx.createRadialGradient(cx, mid, 0, cx, mid, bw * 1.3);
  g.addColorStop(0, '#fff6d0'); g.addColorStop(.35, '#ffc24a'); g.addColorStop(.8, '#ff7a1a'); g.addColorStop(1, '#b83a0a');
  gx.fillStyle = g; gx.fill(body);
  const metal = cx0 => { const mg_ = m.createLinearGradient(cx0 - bw, 0, cx0 + bw, 0);
    mg_.addColorStop(0, '#3a2204'); mg_.addColorStop(.3, '#c99a3a'); mg_.addColorStop(.42, '#f7dc8a'); mg_.addColorStop(.6, '#a8741c'); mg_.addColorStop(1, '#4a2e06'); return mg_; };

  for (let yy = bt + h * .045; yy < bb - h * .03; yy += h * .052, row++) for (let xx = cx - bw; xx <= cx + bw; xx += bw * .25) {
    const px = xx + (row % 2) * bw * .125, hs = bw * .085 * (1 - Math.abs(px - cx) / bw * .4);
    m.beginPath(); m.moveTo(px, yy - hs * 1.4); m.lineTo(px + hs, yy); m.lineTo(px, yy + hs * 1.4); m.lineTo(px - hs, yy); m.closePath(); m.fill();
  }
  m.beginPath(); m.ellipse(cx, mid, bw * .22, h * .1, 0, 0, TAU); m.fill();
  m.globalCompositeOperation = 'source-over';
  m.strokeStyle = '#f7dc8a'; m.lineWidth = Math.max(1, h * .008);
  for (const ox of [-.45, .45]) { m.beginPath(); m.moveTo(cx + bw * ox, bt); m.quadraticCurveTo(cx + bw * ox * 1.18, mid, cx + bw * ox, bb); m.stroke(); }
  m.beginPath(); m.ellipse(cx, mid, bw * .22, h * .1, 0, 0, TAU); m.stroke();
  x.drawImage(gc, 0, 0, W2, H2); x.drawImage(mc, 0, 0, W2, H2);
  x.globalCompositeOperation = 'source-atop';
  g = x.createLinearGradient(cx - bw, 0, cx + bw, 0); g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(.4, 'rgba(0,0,0,0)'); g.addColorStop(.7, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  x.fillStyle = g; x.fillRect(0, 0, W2, H2); x.globalCompositeOperation = 'source-over';
  const mt = x.createLinearGradient(cx - bw, 0, cx + bw, 0);
  mt.addColorStop(0, '#3a2204'); mt.addColorStop(.3, '#c99a3a'); mt.addColorStop(.42, '#fff0b0'); mt.addColorStop(.6, '#a8741c'); mt.addColorStop(1, '#3a2204');
  x.fillStyle = mt;
  x.fillRect(cx - bw * .95, bt - h * .015, bw * 1.9, h * .03); x.fillRect(cx - bw * .92, bb - h * .015, bw * 1.84, h * .03);
  x.beginPath(); x.moveTo(cx - bw * .95, bt); x.quadraticCurveTo(cx - bw * .9, h * .11, cx, h * .085); x.quadraticCurveTo(cx + bw * .9, h * .11, cx + bw * .95, bt); x.fill();
  x.fillStyle = '#ffd27a'; for (let i = -2; i <= 2; i++) { x.beginPath(); x.arc(cx + i * bw * .28, h * .2, h * .009, 0, TAU); x.fill(); }
  x.fillStyle = mt; x.beginPath(); x.arc(cx, h * .07, w * .07, 0, TAU); x.fill();
  x.beginPath(); x.moveTo(cx - w * .02, h * .07); x.lineTo(cx, h * .02); x.lineTo(cx + w * .02, h * .07); x.fill();
  x.beginPath(); x.moveTo(cx - bw * .86, bb); x.quadraticCurveTo(cx - bw * .5, h * .91, cx, h * .955); x.quadraticCurveTo(cx + bw * .5, h * .91, cx + bw * .86, bb); x.fill();
  x.beginPath(); x.arc(cx, h * .97, w * .05, 0, TAU); x.fill();
  for (let i = 0; i < 30; i++) {

    x.beginPath(); x.moveTo(cx + off * .3, h * .99); x.quadraticCurveTo(cx + off * .8, h * .99 + L * .6, cx + off * 1.2, h * .99 + L); x.stroke();
  }

}

function buildLanterns() {
  const big = Math.min(H * .17, 200 * S), small = big * .62;
  lanterns = [
    { s: lanternSprite(big), x: W * .135, len: H * .17, ph: rand(0, TAU), amp: .028 },
    { s: lanternSprite(big), x: W * .865, len: H * .17, ph: rand(0, TAU), amp: .028 },
    { s: lanternSprite(small), x: W * .27, len: H * .045, ph: rand(0, TAU), amp: .035 },
    { s: lanternSprite(small), x: W * .73, len: H * .045, ph: rand(0, TAU), amp: .035 },
  ];
}

function newPetal(init) {
  const red = Math.random() < .35;
  return { x: rand(0, W), y: init ? rand(-H, H) : rand(-60, -10), vy: rand(22, 48) * S, vx: rand(-8, 12) * S, rot: rand(0, TAU), vr: rand(-1.5, 1.5),
           fp: rand(0, TAU), fs: rand(1.5, 3.5), sz: rand(4, 8) * S, c: red ? pick(['#9c0f1c', '#c4161f', '#d42a2a']) : pick(['#ff8a00', '#ffb000', '#ffcf2a']), sw: rand(.6, 1.4), ph: rand(0, TAU) };
}

function measure() {
  const st = document.querySelector('.stage'); let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  for (const el of st.children) { const q = el.getBoundingClientRect(); if (!q.width) continue; l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom); }
  textBox = { l: l - 30, t: t - 30, r: r + 30, b: b + 30 };
  const q = document.querySelector('.title .t').getBoundingClientRect();
  titleBox = { l: q.left, t: q.top, w: q.width, h: q.height };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const [cv, cx] of [[back, bx], [mid, mx], [front, fx]]) { cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  S = Math.max(.55, Math.min(1.45, Math.min(W / 1400, H / 850)));
  GR = Math.max(7, Math.min(13, 9.5 * S));
  XL = Math.round(W * .1); XR = W - XL; SPRING = H * .43; APEX = H * .085;
  SILL = Math.round(H * .8); SILLH = Math.round(H * .022); FLOOR = SILL + SILLH + 3;
  const fh = H - FLOOR;
  RC = { x: W / 2, y: FLOOR + fh * .52, k: .26 }; RC.R = Math.min(W * .16, fh * .42 / RC.k);
  mg = { o: [], y: [], d: [] };
  for (let i = 0; i < 4; i++) mg.o.push(marigold(GR, rand(24, 31), 100, rand(49, 54)));
  for (let i = 0; i < 3; i++) mg.y.push(marigold(GR, rand(40, 46), 100, rand(51, 55)));
  mg.d.push(marigold(GR, 12, 90, 42));
  buildSky(); buildMid(); buildDiyas(T > 4.5); buildLanterns();
  petals = Array.from({ length: Math.round(W / 40) }, () => newPetal(true));
  glitter = Array.from({ length: Math.round(W / 22) }, () => ({ x: rand(0, W), y: rand(0, H), ph: rand(0, TAU), sp: rand(1, 3), s: rand(2, 5) * S, vy: rand(-6, -2) * S }));
  measure();
}

/* ======== FIREWORKS ======== */
function P(x, y, vx, vy, o) {
  return { x, y, vx, vy, c: o.c, life: o.life, max: o.life, size: o.size || 1.6, drag: o.drag ?? .965, grav: o.grav ?? 90,
           tr: o.tr ?? .04, fl: o.fl || 0, st: o.st || 0, gl: o.gl || 0, crk: o.crk || 0,
           hist: o.hl ? [] : null, hl: o.hl || 0, ph: Math.random() * TAU };
}
const inText = (x, y) => textBox && x > textBox.l && x < textBox.r && y > textBox.t && y < textBox.b;


function launch(tx, ty, type, pal) {
  let x = tx, y = ty;
  if (x == null) {
    for (let k = 0; k < 10; k++) {
      x = rand(XL + 50, XR - 50); y = rand(Math.max(archYAt(x) + 60 * S, H * .1), H * .5);
      if (!inText(x, y) || Math.random() < .1) break;
    }
  }
  if (y == null) y = rand(H * .12, H * .45);
  const x0 = x + rand(-1, 1) * W * .03, g = H * .55, h = Math.max(80, SILL - y), vy = -Math.sqrt(2 * g * h), tt = -vy / g;
  rockets.push({ x: x0, y: SILL + 4, vx: (x - x0) / tt, vy, g, type: type || pick(TYPES), pal: pal || pick(PAL) });
  whistle(x0);
}
function explode(x, y, type, pal) {
  const sc = S * rand(.85, 1.15), sp = rand(250, 340) * sc, c0 = pal[0], c1 = pal[1];
  flashes.push({ x, y, a: .6, r: rand(260, 380) * sc, rgb: hexRgb(c0) });
  for (let i = 0; i < 3 && smokes.length < 50; i++) smokes.push({ x: x + rand(-70, 70) * sc, y: y + rand(-50, 60) * sc, r: rand(50, 100) * sc, vr: rand(6, 14) * sc, a: rand(.05, .09), vx: rand(4, 12) * S, vy: rand(2, 8) * S });

  let fa = 0, fr = [255, 200, 120];
  for (const f of flashes) if (f.a > fa) { fa = f.a; fr = f.rgb; }
  if (fa > .02) { c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(${fr[0]},${fr[1]},${fr[2]},${(fa * .045).toFixed(3)})`; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over'; }
  for (const d of diyas) drawDiya(d);
  for (const l of lanterns) drawLantern(l);
  c.globalCompositeOperation = 'source-over';
  for (const p of petals) {
    const flip = Math.cos(AT * p.fs + p.fp);
    c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(Math.max(.15, Math.abs(flip)), 1);
    c.fillStyle = p.c; c.beginPath(); c.ellipse(0, 0, p.sz, p.sz * .62, 0, 0, TAU); c.fill();
    c.fillStyle = flip > 0 ? 'rgba(255,255,255,.14)' : 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(-p.sz * .2, -p.sz * .1, p.sz * .55, p.sz * .3, 0, 0, TAU); c.fill();
    c.restore();
  }
  c.globalCompositeOperation = 'lighter'; c.strokeStyle = '#ffe6a0'; c.lineWidth = 1;
  for (const g of glitter) {
    const a = Math.sin(AT * g.sp + g.ph); if (a < .3) continue;
    c.globalAlpha = (a - .3) / .7 * .85; const s = g.s * a;
    c.beginPath(); c.moveTo(g.x - s, g.y); c.lineTo(g.x + s, g.y); c.moveTo(g.x, g.y - s); c.lineTo(g.x, g.y + s); c.stroke();
  }
  c.globalAlpha = 1;
  drawParts(c, fparts);
  c.globalCompositeOperation = 'source-over';
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; AT = now / 1000;
  if (started) T = (now - t0) / 1000;
  update(dt); drawBack(); drawFront();
  requestAnimationFrame(frame);
}

/* ======== DOORS ======== */
function doorMedallion() {
  let s = '<svg viewBox="-100 -100 200 200" width="100%" height="100%"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4a0c"/><stop offset=".3" stop-color="#f7dc8a"/><stop offset=".5" stop-color="#c98d22"/><stop offset=".7" stop-color="#fff0b0"/><stop offset="1" stop-color="#8a5a14"/></linearGradient><radialGradient id="dgem"><stop offset="0" stop-color="#ff9aa0"/><stop offset=".4" stop-color="#d0102a"/><stop offset="1" stop-color="#4a0008"/></radialGradient></defs>';
  s += '<circle r="96" fill="#2a0307" stroke="url(#dg)" stroke-width="5"/><circle r="84" fill="none" stroke="url(#dg)" stroke-width="2"/><circle r="40" fill="none" stroke="url(#dg)" stroke-width="2"/>';
  for (let i = 0; i < 24; i++) s += `<path transform="rotate(${i * 15})" d="M0,-42 C10,-55 8,-70 0,-80 C-8,-70 -10,-55 0,-42Z" fill="${i % 2 ? 'url(#dg)' : 'none'}" stroke="url(#dg)" stroke-width="1.6"/>`;
  for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; s += `<circle cx="${(Math.cos(a) * 90).toFixed(1)}" cy="${(Math.sin(a) * 90).toFixed(1)}" r="2.2" fill="url(#dg)"/>`; }
  for (let i = 0; i < 12; i++) s += `<path transform="rotate(${i * 30})" d="M0,-10 C6,-18 5,-28 0,-34 C-5,-28 -6,-18 0,-10Z" fill="url(#dg)"/>`;
  s += '<circle r="10" fill="url(#dgem)" stroke="url(#dg)" stroke-width="2.5"/></svg>';
  document.querySelectorAll('.med').forEach(m => m.innerHTML = s);
}

/* ======== INTERACTION ======== */
const sndBtn = document.getElementById('snd');
function toggleSound() { if (!AC) initAudio(); soundOn = !soundOn; if (AC.state === 'suspended') AC.resume(); sndBtn.classList.toggle('active', soundOn); }
function toggleFs() {
  const el = document.documentElement;
  if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
sndBtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
document.getElementById('fs').addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
addEventListener('pointerdown', e => { if (e.target.closest('.ctrl') || !opened) return; launch(e.clientX, e.clientY < SILL - 60 ? e.clientY : H * .35); });
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFs();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'r' || e.key === 'R') location.reload();
  else if (e.key === ' ' && opened) { e.preventDefault(); finale(); nextLaunch = T; }
});
let idleTimer = 0, lastMove = 0;
addEventListener('pointermove', e => {
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  const now = performance.now(); if (now - lastMove < 16) return; lastMove = now;
  for (let i = 0; i < 5; i++) fparts.push(P(e.clientX, e.clientY, rand(-120, 120), rand(-140, 60), { c: pick(['#ffe08a', '#fff6d0', '#ffb347']), life: rand(.2, .5), size: 1.2, drag: .92, grav: 300, tr: .025 }));
});
idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);

/* ======== START ======== */
doorMedallion();
let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(resize, 150); });
const fontsReady = document.fonts ? Promise.all(['40px GV', 'italic 500 40px CG', '600 40px CZ', '40px YT'].map(f => document.fonts.load(f, f.endsWith('YT') ? 'शुभ' : 'Ha'))).catch(() => {}) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  resize(); requestAnimationFrame(frame);
  setTimeout(() => {
    document.body.classList.add('go'); started = true; t0 = performance.now();
    setTimeout(() => document.body.classList.add('open'), 1100);
    setTimeout(() => { document.getElementById('doors').style.display = 'none'; }, 4600);
    setTimeout(measure, 300); setTimeout(measure, 9000);
  }, 200);
});
})();
</script>
